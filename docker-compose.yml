services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fuel
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fuel_finder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data: