services:
  postgres:
    image: postgis/postgis:16-3.4
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: .
    ports:
      - "8668:8668"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres
    command: uvicorn api.main:app --host 0.0.0.0 --port 8668

  updater:
    build: .
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres
    command: python -m updater.scheduler

volumes:
  postgres_data: